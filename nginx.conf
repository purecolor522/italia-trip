server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Ensure correct MIME for webmanifest and SVG
  types {
    application/manifest+json webmanifest;
    image/svg+xml svg;
  }

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_types text/html text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Cache assets for 1 hour
  location ~* \.(svg|webmanifest)$ {
    add_header Cache-Control "public, max-age=3600";
  }

  # SPA-style fallback to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
